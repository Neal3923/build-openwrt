# OpenWrt 智能编译工作流 - 优化版本
# 支持通过Web界面触发的自动化编译，解决Ubuntu 20.04弃用问题

name: 🛠️ OpenWrt 智能编译
run-name: "OpenWrt · ${{ github.event.client_payload.config.build_id || github.event.client_payload.build_id || inputs.build_description || github.run_number }}"

permissions:
  contents: read
  
on:
  # 支持通过Repository Dispatch触发（来自Web界面）
  repository_dispatch:
    types: [web_build]
    
  
  # 支持手动触发
  workflow_dispatch:
    inputs:
      source_branch:
        description: "源码仓库"
        required: true
        default: "lede-master"
        type: choice
        options:
          - openwrt-main
          - lede-master
          - immortalwrt-master
          - Lienol-master

      repo_branch:
        description: "实际仓库分支/版本（auto使用该源码的默认值）"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - main
          - master
          - "20251001"
          - "20230609"
          - "20221001"
          - openwrt-25.12
          - openwrt-24.10
          - openwrt-23.05
          - "25.12"
          - "24.10"
          - "23.05"
          - "19.07"
      
      target_device:
        description: "目标设备"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64

      rootfs_partsize:
        description: "EXT4根分区容量（MiB，128–4096）"
        required: true
        default: "512"
        type: string
      
      plugins_list:
        description: "插件列表(用逗号分隔)"
        required: false
        default: ""
        type: string
      
      build_description:
        description: "编译描述"
        required: false
        default: "智能编译"
        type: string

# 环境变量配置
env:
  TZ: Asia/Shanghai

jobs:
  # 准备阶段：解析配置和设置环境
  prepare:
    runs-on: ubuntu-24.04
    name: 📋 配置解析
    outputs:
      source_branch: ${{ steps.config.outputs.source_branch }}
      target_device: ${{ steps.config.outputs.target_device }}
      rootfs_partsize: ${{ steps.config.outputs.rootfs_partsize }}
      plugins_list: ${{ steps.config.outputs.plugins_list }}
      build_tag: ${{ steps.config.outputs.build_tag }}
      repo_url: ${{ steps.config.outputs.repo_url }}
      repo_branch: ${{ steps.config.outputs.repo_branch }}
      device_profile: ${{ steps.config.outputs.device_profile }}
      source_name: ${{ steps.config.outputs.source_name }}
      device_name: ${{ steps.config.outputs.device_name }}
      feeds_conf: ${{ steps.config.outputs.feeds_conf }}
      config_file: ${{ steps.config.outputs.config_file }}

      
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7  # Node.js 24
      
      - name: ⚙️ 解析编译配置
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_BRANCH: ${{ github.event.client_payload.config.source_branch || github.event.client_payload.source_branch }}
          DISPATCH_REPO_BRANCH: ${{ github.event.client_payload.config.repo_branch || github.event.client_payload.repo_branch }}
          DISPATCH_TARGET_DEVICE: ${{ github.event.client_payload.config.target_device || github.event.client_payload.target_device }}
          DISPATCH_ROOTFS_PARTSIZE: ${{ github.event.client_payload.config.rootfs_partsize || github.event.client_payload.rootfs_partsize }}
          DISPATCH_PLUGINS: ${{ github.event.client_payload.config.plugins || github.event.client_payload.plugins }}
          INPUT_SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
          INPUT_REPO_BRANCH: ${{ github.event.inputs.repo_branch }}
          INPUT_TARGET_DEVICE: ${{ github.event.inputs.target_device }}
          INPUT_ROOTFS_PARTSIZE: ${{ github.event.inputs.rootfs_partsize }}
          INPUT_PLUGINS: ${{ github.event.inputs.plugins_list }}
          INPUT_BUILD_DESCRIPTION: ${{ github.event.inputs.build_description }}
        run: |
          # 优先使用Repository Dispatch的配置，其次使用手动输入
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "🌐 检测到Web界面触发的编译请求"
            SOURCE_BRANCH="$DISPATCH_SOURCE_BRANCH"
            REQUESTED_REPO_BRANCH="$DISPATCH_REPO_BRANCH"
            TARGET_DEVICE="$DISPATCH_TARGET_DEVICE"
            ROOTFS_PARTSIZE="$DISPATCH_ROOTFS_PARTSIZE"
            PLUGINS_LIST="$DISPATCH_PLUGINS"
            BUILD_DESC="Web界面编译"
          else
            echo "🖱️ 检测到手动触发的编译请求"
            SOURCE_BRANCH="$INPUT_SOURCE_BRANCH"
            REQUESTED_REPO_BRANCH="$INPUT_REPO_BRANCH"
            TARGET_DEVICE="$INPUT_TARGET_DEVICE"
            ROOTFS_PARTSIZE="$INPUT_ROOTFS_PARTSIZE"
            PLUGINS_LIST="$INPUT_PLUGINS"
            BUILD_DESC="$INPUT_BUILD_DESCRIPTION"
          fi
          
          # 设置默认值
          SOURCE_BRANCH=${SOURCE_BRANCH:-"lede-master"}
          REQUESTED_REPO_BRANCH=${REQUESTED_REPO_BRANCH:-"auto"}
          TARGET_DEVICE=${TARGET_DEVICE:-"x86_64"}
          ROOTFS_PARTSIZE=${ROOTFS_PARTSIZE:-"512"}
          PLUGINS_LIST=${PLUGINS_LIST:-""}
          BUILD_DESC=${BUILD_DESC:-"智能编译"}

          if [[ ! "$ROOTFS_PARTSIZE" =~ ^[0-9]+$ ]] ||
             (( ROOTFS_PARTSIZE < 128 || ROOTFS_PARTSIZE > 4096 )); then
            echo "::error::根分区容量必须是 128–4096 之间的整数，当前值: $ROOTFS_PARTSIZE"
            exit 1
          fi

          # 规范化并验证插件名称，避免无效输入污染GITHUB_OUTPUT或Shell命令。
          read -ra REQUESTED_PLUGINS <<< "${PLUGINS_LIST//,/ }"
          NORMALIZED_PLUGINS=()
          for plugin in "${REQUESTED_PLUGINS[@]}"; do
            if [[ ! "$plugin" =~ ^[a-zA-Z0-9][a-zA-Z0-9._+-]*$ ]]; then
              echo "::error::无效的插件名称: $plugin"
              exit 1
            fi
            NORMALIZED_PLUGINS+=("$plugin")
          done
          PLUGINS_LIST=$(IFS=,; echo "${NORMALIZED_PLUGINS[*]}")
          
          echo "📋 编译配置信息:"
          echo "  源码仓库: $SOURCE_BRANCH"
          echo "  请求分支: $REQUESTED_REPO_BRANCH"
          echo "  目标设备: $TARGET_DEVICE"
          echo "  根分区容量: ${ROOTFS_PARTSIZE} MiB"
          echo "  插件列表: $PLUGINS_LIST"
          echo "  编译描述: $BUILD_DESC"
          
          # 根据源码分支设置仓库信息和配置文件路径
          case $SOURCE_BRANCH in
            "openwrt-main")
              REPO_URL="https://github.com/openwrt/openwrt"
              DEFAULT_REPO_BRANCH="main"
              ALLOWED_REPO_BRANCHES="main openwrt-25.12 openwrt-24.10 openwrt-23.05"
              SOURCE_NAME="OpenWrt官方"
              FEEDS_CONF="config/openwrt-main/feeds.conf.default"
              CONFIG_FILE="config/openwrt-main/config"

              ;;
            "lede-master")
              REPO_URL="https://github.com/coolsnowwolf/lede"
              DEFAULT_REPO_BRANCH="master"
              ALLOWED_REPO_BRANCHES="master 20251001 20230609 20221001"
              SOURCE_NAME="Lean's LEDE"
              FEEDS_CONF="config/lede-master/feeds.conf.default"
              CONFIG_FILE="config/lede-master/config"

              ;;
            "immortalwrt-master")
              REPO_URL="https://github.com/immortalwrt/immortalwrt"
              DEFAULT_REPO_BRANCH="master"
              ALLOWED_REPO_BRANCHES="master openwrt-25.12 openwrt-24.10 openwrt-23.05"
              SOURCE_NAME="ImmortalWrt"
              FEEDS_CONF="config/immortalwrt-master/feeds.conf.default"
              CONFIG_FILE="config/immortalwrt-master/config"

              ;;
            "Lienol-master")
              REPO_URL="https://github.com/Lienol/openwrt"
              DEFAULT_REPO_BRANCH="25.12"
              ALLOWED_REPO_BRANCHES="25.12 24.10 23.05 19.07"
              SOURCE_NAME="Lienol"
              FEEDS_CONF="config/Lienol-master/feeds.conf.default"
              CONFIG_FILE="config/Lienol-master/config"

              ;;
            *)
              echo "❌ 不支持的源码分支: $SOURCE_BRANCH"
              exit 1
              ;;
          esac

          # auto使用各源码默认分支，显式选择时校验源码与分支组合。
          if [ "$REQUESTED_REPO_BRANCH" = "auto" ]; then
            REPO_BRANCH="$DEFAULT_REPO_BRANCH"
          elif [[ " $ALLOWED_REPO_BRANCHES " == *" $REQUESTED_REPO_BRANCH "* ]]; then
            REPO_BRANCH="$REQUESTED_REPO_BRANCH"
          else
            echo "::error::源码 $SOURCE_BRANCH 不支持分支/版本 $REQUESTED_REPO_BRANCH"
            echo "::error::可用分支/版本: $ALLOWED_REPO_BRANCHES"
            exit 1
          fi

          echo "  实际分支: $REPO_BRANCH"

          # Bandix依赖Linux 6.x，上游仅推荐OpenWrt 24.10及以上版本。
          if [[ ",$PLUGINS_LIST," == *",luci-app-bandix,"* ]]; then
            case "$SOURCE_BRANCH:$REPO_BRANCH" in
              openwrt-main:main|openwrt-main:openwrt-25.12|openwrt-main:openwrt-24.10|\
              lede-master:master|lede-master:20251001|\
              immortalwrt-master:master|immortalwrt-master:openwrt-25.12|immortalwrt-master:openwrt-24.10|\
              Lienol-master:25.12|Lienol-master:24.10)
                ;;
              *)
                echo "::error::Bandix仅支持Linux 6.x及OpenWrt 24.10以上分支，当前为 $SOURCE_BRANCH / $REPO_BRANCH"
                exit 1
                ;;
            esac
          fi

          # Argon master仅面向现代LuCI；Lean's LEDE需要旧的18.06配置插件，不能混用。
          if [[ ",$PLUGINS_LIST," == *",luci-theme-argon,"* ]]; then
            case "$SOURCE_BRANCH:$REPO_BRANCH" in
              openwrt-main:main|openwrt-main:openwrt-25.12|openwrt-main:openwrt-24.10|\
              immortalwrt-master:master|immortalwrt-master:openwrt-25.12|immortalwrt-master:openwrt-24.10|\
              Lienol-master:25.12|Lienol-master:24.10)
                ;;
              *)
                echo "::error::Argon当前版本仅支持现代LuCI的OpenWrt/ImmortalWrt及Lienol 24.10以上分支，当前为 $SOURCE_BRANCH / $REPO_BRANCH"
                exit 1
                ;;
            esac
          fi
          
          # 本项目只构建x86_64，拒绝旧页面或手工请求传入的其他设备值。
          if [ "$TARGET_DEVICE" != "x86_64" ]; then
            echo "::error::不支持的目标设备: $TARGET_DEVICE（仅支持 x86_64）"
            exit 1
          fi
          DEVICE_PROFILE="x86/64"
          DEVICE_NAME="X86_64"
          
          # 生成构建标签
          BRANCH_TAG=$(printf '%s' "$REPO_BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')
          BUILD_TAG="OpenWrt_${SOURCE_NAME// /_}_${BRANCH_TAG}_${DEVICE_NAME}_$(date +%Y%m%d_%H%M%S)"
          
          # 输出配置到环境变量
          echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT
          echo "target_device=$TARGET_DEVICE" >> $GITHUB_OUTPUT
          echo "rootfs_partsize=$ROOTFS_PARTSIZE" >> "$GITHUB_OUTPUT"
          printf 'plugins_list=%s\n' "$PLUGINS_LIST" >> "$GITHUB_OUTPUT"
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "repo_url=$REPO_URL" >> $GITHUB_OUTPUT
          echo "repo_branch=$REPO_BRANCH" >> $GITHUB_OUTPUT
          echo "device_profile=$DEVICE_PROFILE" >> $GITHUB_OUTPUT
          echo "source_name=$SOURCE_NAME" >> $GITHUB_OUTPUT
          echo "device_name=$DEVICE_NAME" >> $GITHUB_OUTPUT
          echo "feeds_conf=$FEEDS_CONF" >> $GITHUB_OUTPUT
          echo "config_file=$CONFIG_FILE" >> $GITHUB_OUTPUT

          
          echo "✅ 编译环境初始化完成,配置解析完成"
  # 编译阶段：实际的固件编译过程
  build:
    runs-on: ubuntu-24.04
    needs: prepare
    name: 🔨 固件编译
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}  # 安全检查
    permissions:
      contents: write
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: 🚀 初始化编译环境
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::编译环境初始化失败（脚本第 ${LINENO} 行）"' ERR

          echo "🔧 开始初始化编译环境..."
          umask 022
          
          # 显示系统信息
          echo "📋 系统信息:"
          lsb_release -a
          echo "💾 磁盘空间:"
          df -h
          
          # 清理不需要的预装工具以释放空间，但绝不能删除APT软件源配置。
          echo "🧹 清理系统空间..."
          docker image prune --all --force >/dev/null 2>&1 || true
          if [[ "${AGENT_TOOLSDIRECTORY:-}" == /opt/hostedtoolcache* ]]; then
            sudo rm -rf -- "${AGENT_TOOLSDIRECTORY}"
          fi
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android 2>/dev/null || true

          # Ubuntu 24.04的官方软件源位于/etc/apt/sources.list.d/ubuntu.sources。
          # 如果软件源缺失，立即停止，避免后续依赖安装被误报为成功。
          if ! grep -RqsE '^[[:space:]]*(deb |Types:[[:space:]]*deb)' \
            /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
            echo "::error::未找到有效的APT软件源配置"
            exit 1
          fi
          
          # 更新软件包列表
          echo "🔄 更新软件包列表..."
          APT_GET=(sudo -E apt-get -o Acquire::Retries=3)
          "${APT_GET[@]}" update

          BUILD_ESSENTIAL_CANDIDATE="$(apt-cache policy build-essential | awk '/Candidate:/ { print $2 }')"
          if [[ -z "$BUILD_ESSENTIAL_CANDIDATE" || "$BUILD_ESSENTIAL_CANDIDATE" == "(none)" ]]; then
            echo "::error::APT软件源不可用：build-essential没有可安装版本"
            exit 1
          fi
          
          # 只卸载实际存在的非必要预装软件，避免libreoffice*产生无意义错误。
          echo "🗑️ 清理不必要的软件包..."
          mapfile -t REMOVABLE_PACKAGES < <(
            dpkg-query -W -f='${binary:Package}\n' \
              azure-cli firefox powershell thunderbird 'libreoffice*' 2>/dev/null || true
          )
          if (( ${#REMOVABLE_PACKAGES[@]} > 0 )); then
            "${APT_GET[@]}" remove --purge -y "${REMOVABLE_PACKAGES[@]}" || \
              echo "::warning::部分非必要预装软件未能移除，将继续编译"
          fi

          # 使用Ubuntu 24.04中可用的包名，覆盖官方OpenWrt、LEDE、
          # ImmortalWrt和Lienol常见分支的构建依赖。
          echo "📦 安装OpenWrt编译依赖..."
          BUILD_PACKAGES=(
            ack antlr3 asciidoc autoconf automake autopoint binutils bison
            build-essential bzip2 ccache clang cmake cpio curl
            device-tree-compiler ecj fastjar file flex g++-multilib gawk
            gcc-multilib genisoimage gettext git gperf gzip haveged help2man
            intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev
            libgmp-dev libgnutls28-dev libltdl-dev libmpc-dev libmpfr-dev
            libncurses-dev libnsl-dev libpython3-dev libreadline-dev libssl-dev
            libtool libyaml-dev lld llvm lrzsz msmtp ninja-build p7zip-full
            patch perl pkgconf python3 python3-dev python3-docutils python3-pip
            python3-ply python3-pyelftools python3-setuptools python3-wheel
            qemu-utils re2c rsync scons squashfs-tools subversion swig tar
            texinfo time uglifyjs unzip upx-ucl wget xmlto xsltproc xxd yasm
            zlib1g-dev zstd
          )
          "${APT_GET[@]}" install -y --no-install-recommends "${BUILD_PACKAGES[@]}"
          
          # 系统清理
          echo "🧹 清理系统..."
          "${APT_GET[@]}" autoremove --purge -y || true
          "${APT_GET[@]}" clean
          
          # 创建工作目录
          echo "📁 创建工作目录..."
          sudo mkdir -p /workdir
          sudo chown "$USER:$(id -gn)" /workdir
          
          # 设置时区
          echo "🕒 设置时区..."
          sudo timedatectl set-timezone "$TZ" || \
            echo "::warning::无法修改系统时区，将继续使用TZ环境变量"
          
          # 验证关键工具。任一缺失都不能把初始化标记为成功。
          echo "✅ 验证编译环境..."
          REQUIRED_COMMANDS=(
            bison ccache cmake dtc flex g++ gawk gcc git make msgfmt
            mksquashfs perl python3 rsync svn swig unzip
          )
          MISSING_COMMANDS=()
          for command_name in "${REQUIRED_COMMANDS[@]}"; do
            if ! command -v "$command_name" >/dev/null 2>&1; then
              MISSING_COMMANDS+=("$command_name")
            fi
          done

          if (( ${#MISSING_COMMANDS[@]} > 0 )); then
            echo "::error::缺少关键编译工具: ${MISSING_COMMANDS[*]}"
            exit 1
          fi

          gcc --version | sed -n '1p'
          make --version | sed -n '1p'
          git --version
          python3 --version
          cmake --version | sed -n '1p'
          
          # 显示最终的磁盘空间
          echo "💾 清理后磁盘空间:"
          df -h
          
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "✅ 编译环境初始化完成"

      - name: 📦 克隆源码
        id: codes
        working-directory: /workdir
        if: steps.init.outputs.status == 'success' && !cancelled()
        env:
          PLUGINS_LIST: ${{ needs.prepare.outputs.plugins_list }}
        run: |
          echo "📦 开始克隆源码..."
          echo "  仓库: ${{ needs.prepare.outputs.repo_url }}"
          echo "  分支: ${{ needs.prepare.outputs.repo_branch }}"
          
          # 显示磁盘空间
          df -hT $PWD
          
          # 克隆源码（只克隆最新提交以节省时间和空间）
          git clone -q --single-branch --depth=1 \
            --branch "${{ needs.prepare.outputs.repo_branch }}" \
            "${{ needs.prepare.outputs.repo_url }}" openwrt
          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

          if [[ ",$PLUGINS_LIST," == *",luci-app-bandix,"* ]]; then
            KERNEL_PATCHVER=$(sed -n \
              's/^[[:space:]]*KERNEL_PATCHVER[[:space:]]*:=[[:space:]]*//p' \
              openwrt/target/linux/x86/Makefile | head -n 1)
            if [[ ! "$KERNEL_PATCHVER" =~ ^6\. ]]; then
              echo "::error::Bandix要求Linux 6.x，当前x86内核版本为: ${KERNEL_PATCHVER:-未知}"
              exit 1
            fi
            echo "✅ Bandix内核兼容性检查通过: Linux $KERNEL_PATCHVER"
          fi
          
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "✅ 源码克隆完成"
      - name: 🔧 加载自定义feeds
        env:
          PLUGINS_LIST: ${{ needs.prepare.outputs.plugins_list }}
        run: |
          echo "🔧 配置自定义feeds..."
          
          # 如果存在对应分支的feeds配置文件则使用
          if [ -f "${{ needs.prepare.outputs.feeds_conf }}" ]; then
            cp -f "${{ needs.prepare.outputs.feeds_conf }}" openwrt/feeds.conf.default
            echo "📋 使用自定义feeds配置: ${{ needs.prepare.outputs.feeds_conf }}"
          else
            echo "📋 使用默认feeds配置"
          fi

          # 保留当前源码自带的feeds，只追加所选插件需要的第三方feeds。
          # 这样可避免把OpenWrt、LEDE、ImmortalWrt等不同源码的基础feeds混用。
          bash script/manage-feeds.sh \
            "$PLUGINS_LIST" \
            openwrt/feeds.conf.default \
            "${{ needs.prepare.outputs.source_branch }}" \
            "${{ needs.prepare.outputs.repo_branch }}"

      - name: 📥 更新feeds
        run: |
          set -euo pipefail
          echo "📥 开始更新feeds..."
          cd openwrt/

          # feeds依赖外部Git仓库，遇到短暂网络波动时最多重试3次。
          FEEDS_UPDATED=false
          for attempt in 1 2 3; do
            if ./scripts/feeds update -a; then
              FEEDS_UPDATED=true
              break
            fi
            echo "::warning::feeds更新第 ${attempt} 次失败"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          if [ "$FEEDS_UPDATED" != "true" ]; then
            echo "::error::feeds更新连续3次失败"
            exit 1
          fi

          verify_pinned_feed() {
            local feed_name="$1"
            local feed_url expected_revision actual_revision

            feed_url=$(awk -v name="$feed_name" \
              '$1 ~ /^src-git/ && $2 == name { print $3; exit }' \
              feeds.conf.default)
            if [[ "$feed_url" != *"^"* ]]; then
              return
            fi

            expected_revision="${feed_url##*^}"
            actual_revision=$(git -C "feeds/$feed_name" rev-parse HEAD)
            if [ "$actual_revision" != "$expected_revision" ]; then
              echo "::error::$feed_name 版本校验失败，期望 $expected_revision，实际 $actual_revision"
              exit 1
            fi
            echo "  ✅ $feed_name 已固定到 $actual_revision"
          }

          verify_pinned_feed passwall_packages
          verify_pinned_feed passwall
          echo "✅ feeds更新完成"

      - name: 🎨 安装 Argon 独立源码包
        if: contains(needs.prepare.outputs.plugins_list, 'luci-theme-argon')
        run: |
          set -Eeuo pipefail
          cd openwrt

          PACKAGE_ROOT="$PWD/package/community"
          mkdir -p "$PACKAGE_ROOT"

          install_argon_package() {
            local package_name="$1"
            local repository_url="$2"
            local package_path="$PACKAGE_ROOT/$package_name"

            if [[ -f "$package_path/Makefile" ]]; then
              echo "ℹ️ 源码中已存在 $package_name，保留现有版本"
              return
            fi

            if [[ -e "$package_path" || -L "$package_path" ]]; then
              echo "::error::Argon源码目标路径异常，拒绝覆盖: $package_path"
              exit 1
            fi

            echo "📦 获取独立源码包: $package_name"
            git clone -q --depth=1 --single-branch "$repository_url" "$package_path"

            if [[ ! -s "$package_path/Makefile" ]]; then
              echo "::error::Argon源码包缺少Makefile: $package_path"
              exit 1
            fi

            echo "✅ 已安装独立源码包: $package_name"
          }

          install_argon_package \
            "luci-theme-argon" \
            "https://github.com/jerrykuku/luci-theme-argon"
          install_argon_package \
            "luci-app-argon-config" \
            "https://github.com/jerrykuku/luci-app-argon-config"

      - name: 🩹 修复 OpenWrt 25.12 PassWall 下载哈希
        if: >-
          needs.prepare.outputs.source_branch == 'openwrt-main' &&
          needs.prepare.outputs.repo_branch == 'openwrt-25.12' &&
          contains(needs.prepare.outputs.plugins_list, 'luci-app-passwall')
        run: |
          set -euo pipefail

          # PassWall main 当前使用旧归档哈希，而 OpenWrt 25.12 对同一固定 Git
          # 提交的可复现归档会生成另一个哈希。只接受这两个已知值，避免关闭校验。
          fix_passwall_hash() {
            local package_name="$1"
            local upstream_hash="$2"
            local openwrt_2512_hash="$3"
            local package_makefile="openwrt/feeds/passwall_packages/$package_name/Makefile"
            local current_hash

            if [ ! -f "$package_makefile" ]; then
              echo "::error::未找到 PassWall 软件包配置: $package_makefile"
              exit 1
            fi

            current_hash=$(sed -n 's/^PKG_MIRROR_HASH:=//p' "$package_makefile")
            if [ "$current_hash" = "$openwrt_2512_hash" ]; then
              echo "✅ $package_name 已包含 OpenWrt 25.12 所需哈希"
              return
            fi

            if [ "$current_hash" != "$upstream_hash" ]; then
              echo "::error::$package_name 上游哈希已发生未知变化，拒绝自动覆盖: $current_hash"
              exit 1
            fi

            sed -i \
              "s/^PKG_MIRROR_HASH:=$upstream_hash$/PKG_MIRROR_HASH:=$openwrt_2512_hash/" \
              "$package_makefile"
            grep -qxF "PKG_MIRROR_HASH:=$openwrt_2512_hash" "$package_makefile"
            echo "✅ 已应用 OpenWrt 25.12 的 $package_name 哈希兼容修复"
          }

          fix_passwall_hash \
            shadowsocksr-libev \
            146fa4511a52da2aaa1e11ea0294cfb450e62643156c5da3b10e037ef43961f6 \
            42dab453a7d8b3737109110083513467bad1cf71a0aaf671452595797b2b59b0
          fix_passwall_hash \
            simple-obfs \
            bc97eba511b86a089ab4bcf0ac78d9e4a39c59046d5cde77b79a118245daa0ba \
            b06d72a973de85fd2d45542f436e4aab5d96de6c78f4f0b9f6697e1730d1d211
      - name: 📦 安装feeds
        run: |
          set -euo pipefail
          echo "📦 开始安装feeds..."
          cd openwrt/
          ./scripts/feeds install -a
          echo "✅ feeds安装完成"
      - name: 🔧 生成最终编译配置
        env:
          PLUGINS_LIST: ${{ needs.prepare.outputs.plugins_list }}
          ROOTFS_PARTSIZE: ${{ needs.prepare.outputs.rootfs_partsize }}
        run: |
          set -euo pipefail
          bash script/configure-x86-build.sh \
            --source-dir openwrt \
            --plugins "$PLUGINS_LIST" \
            --rootfs "$ROOTFS_PARTSIZE"
          echo "✅ 编译配置生成完成"
      - name: 📥 下载依赖包
        id: package
        run: |
          set -euo pipefail
          echo "📥 开始下载依赖包..."
          cd openwrt

          DOWNLOAD_JOBS=$(( $(nproc) * 2 ))
          DOWNLOAD_TARGETS=(
            tools/download
            toolchain/download
            package/download
            target/download
          )

          # OpenWrt 的总 download 目标使用分号依次执行子目标，前面的失败可能被
          # 最后一个成功的子目标掩盖。逐项覆盖 DOWNLOAD_DIRS，确保错误能正确传递。
          for download_target in "${DOWNLOAD_TARGETS[@]}"; do
            DOWNLOAD_OK=false
            for attempt in 1 2; do
              find dl -type f -size -1024c -print -delete 2>/dev/null || true
              if make download DOWNLOAD_DIRS="$download_target" -j"$DOWNLOAD_JOBS"; then
                DOWNLOAD_OK=true
                break
              fi
              echo "::warning::${download_target} 并行下载第 ${attempt} 次失败"
              sleep $((attempt * 5))
            done

            if [ "$DOWNLOAD_OK" != "true" ]; then
              echo "::warning::${download_target} 并行下载仍失败，切换到单线程详细日志"
              find dl -type f -size -1024c -print -delete 2>/dev/null || true
              make download DOWNLOAD_DIRS="$download_target" -j1 V=s
            fi
          done

          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "✅ 依赖包下载完成"
      - name: 🔨 编译固件
        id: compile
        run: |
          set -euo pipefail
          echo "🔨 开始编译固件..."
          cd openwrt
          
          echo "使用 $(nproc) 线程编译"
          # OpenWrt为每个包保存独立日志；失败时直接输出对应日志，避免单线程重编整个固件。
          if ! make -j"$(nproc)" BUILD_LOG=1; then
            echo "::error::并行编译失败，正在输出失败包的详细日志"
            bash "$GITHUB_WORKSPACE/script/report-build-failures.sh" "$PWD"
            exit 1
          fi
          
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "✅ 固件编译完成"
      - name: 📊 检查空间使用
        if: (!cancelled())
        run: |
          echo "📊 检查磁盘空间使用情况..."
          df -hT
      - name: 📦 整理编译产物
        id: organize
        if: steps.compile.outputs.status == 'success'
        env:
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
          REPO_BRANCH: ${{ needs.prepare.outputs.repo_branch }}
          TARGET_DEVICE: ${{ needs.prepare.outputs.target_device }}
        run: |
          echo "📦 开始整理编译产物..."
          cd openwrt/bin/targets/*/*
          
          # 删除packages目录以节省空间
          rm -rf packages
          
          # 计算固件大小
          FIRMWARE_SIZE=$(du -sh . | cut -f1)
          echo "FIRMWARE_SIZE=$FIRMWARE_SIZE" >> $GITHUB_ENV
          
          # 重命名固件文件，同时保留原始类型名，避免多个.gz文件互相覆盖。
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SOURCE_CLEAN=$(printf '%s_%s' "$SOURCE_BRANCH" "$REPO_BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')
          DEVICE_CLEAN=$(printf '%s' "$TARGET_DEVICE" | sed 's/[^a-zA-Z0-9._-]/_/g')
          FIRMWARE_COUNT=0

          for file in *; do
            if [[ "$file" == *.bin ]] || [[ "$file" == *.img ]] || [[ "$file" == *.gz ]]; then
              ORIGINAL_NAME="${file#openwrt-}"
              NEW_NAME="OpenWrt_${SOURCE_CLEAN}_${DEVICE_CLEAN}_${TIMESTAMP}_${ORIGINAL_NAME}"
              mv -- "$file" "$NEW_NAME"
              FIRMWARE_COUNT=$((FIRMWARE_COUNT + 1))
              echo "📦 重命名: $file -> $NEW_NAME"
            fi
          done

          if [ "$FIRMWARE_COUNT" -eq 0 ]; then
            echo "::error::目标目录中没有找到固件文件"
            exit 1
          fi
          
          # 生成详细的固件信息文件
          cat > firmware_info.txt << EOF
          OpenWrt 智能编译固件信息
          ========================
          
          📋 基本信息:
          编译时间: $(date '+%Y-%m-%d %H:%M:%S')
          构建标签: ${{ needs.prepare.outputs.build_tag }}
          源码仓库: ${{ needs.prepare.outputs.source_name }}
          实际分支: ${{ needs.prepare.outputs.repo_branch }}
          目标设备: ${{ needs.prepare.outputs.device_name }}
          固件大小: ${FIRMWARE_SIZE}
          
          🔧 编译配置:
          选中插件: ${{ needs.prepare.outputs.plugins_list }}
          设备配置: ${{ needs.prepare.outputs.device_profile }}
          根分区容量: ${{ needs.prepare.outputs.rootfs_partsize }} MiB
          
          📱 默认信息:
          - 默认IP地址: 192.168.1.1
          - 默认用户名: root
          - 默认密码: 以所选源码的默认配置为准，请首次登录后立即设置
          - 默认WiFi名: OpenWrt (如支持)
          - 默认WiFi密码: 无
          
          📖 使用说明:
          1. 刷机前请确认设备型号和硬件版本
          2. 建议先备份原厂固件
          3. 刷机有风险，请谨慎操作
          4. 如遇问题可尝试救砖操作
          
          🔗 相关链接:
          - 项目地址: https://github.com/${{ github.repository }}
          - OpenWrt官网: https://openwrt.org
          - 使用文档: https://github.com/${{ github.repository }}/wiki
          
          ⚠️ 免责声明:
          本固件仅供学习交流使用，使用者需自行承担刷机风险。
          EOF
          
          # 生成SHA256校验文件
          for file in OpenWrt_*.bin OpenWrt_*.img OpenWrt_*.gz; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> sha256sums.txt
              echo "🔒 生成校验: $file"
            fi
          done
          
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ 编译产物整理完成"
      - name: 🎉 生成发布版本
        id: release
        if: steps.organize.outputs.status == 'success'
        run: |
          RELEASE_TAG="${{ needs.prepare.outputs.build_tag }}"
          RELEASE_NAME="OpenWrt 智能编译 - ${{ needs.prepare.outputs.device_name }} ($(date '+%Y-%m-%d %H:%M'))"
          
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          
          echo "📋 发布信息:"
          echo "标签: $RELEASE_TAG"
          echo "名称: $RELEASE_NAME"
      - name: 📢 发布固件到 Releases
        uses: softprops/action-gh-release@v3  # Node.js 24
        if: steps.release.outputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: ${{ steps.release.outputs.release_name }}
          body_path: ${{ env.FIRMWARE_PATH }}/firmware_info.txt
          files: |
            ${{ env.FIRMWARE_PATH }}/OpenWrt_*
            ${{ env.FIRMWARE_PATH }}/sha256sums.txt
          draft: false
          prerelease: false

      - name: 📊 编译完成通知
        run: |
          echo "🎉 OpenWrt智能编译任务完成!"
          echo "📦 固件信息:"
          echo "  源码: ${{ needs.prepare.outputs.source_name }}"
          echo "  设备: ${{ needs.prepare.outputs.device_name }}"
          echo "  大小: ${{ env.FIRMWARE_SIZE }}"
          echo "  标签: ${{ needs.prepare.outputs.build_tag }}"
          echo ""
          echo "🔗 下载链接:"
          echo "  Releases: https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.release_tag }}"
          echo ""
          echo "📝 编译日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
# 编译失败处理
  failure_handler:
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    if: failure()
    name: ❌ 编译失败处理
    
    steps:
      - name: 📝 生成失败报告
        run: |
          echo "❌ OpenWrt工作流失败"
          echo "📋 失败信息:"
          echo "  配置解析Job: ${{ needs.prepare.result }}"
          echo "  构建与发布Job: ${{ needs.build.result }}"
          echo "  源码: ${{ needs.prepare.outputs.source_branch }}"
          echo "  分支: ${{ needs.prepare.outputs.repo_branch }}"
          echo "  设备: ${{ needs.prepare.outputs.target_device }}"
          echo "  根分区容量: ${{ needs.prepare.outputs.rootfs_partsize }} MiB"
          echo "  插件: ${{ needs.prepare.outputs.plugins_list }}"
          echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "🔍 排查顺序:"
          echo "  1. 查看日志中最早出现的 ::error:: 或 Error"
          echo "  2. 检查插件可用性与feeds更新结果"
          echo "  3. 检查固件编译和Release发布步骤"
          echo "  4. 检查网络、磁盘空间或上游源码问题"
          echo ""
          echo "📖 解决建议:"
          echo "  1. 检查插件冲突检测结果"
          echo "  2. 减少选择的插件数量"
          echo "  3. 选择更稳定的源码分支"
          echo "  4. 查看详细的编译日志"
          echo ""
          echo "🔗 编译日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

# 工作流记录清理：使用GitHub CLI替代未固定版本的第三方Action。
  cleanup:
    runs-on: ubuntu-24.04
    needs: build
    if: always()
    name: 🧹 清理旧的工作流程记录
    permissions:
      actions: write
      contents: read

    steps:
      - name: 🧹 保留7天内且至少5次运行
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RETAIN_DAYS: "7"
          KEEP_MINIMUM_RUNS: "5"
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "$RETAIN_DAYS days ago" +%s)
          RUN_INDEX=0

          while IFS=$'\t' read -r RUN_ID CREATED_AT; do
            RUN_INDEX=$((RUN_INDEX + 1))
            if [ "$RUN_INDEX" -le "$KEEP_MINIMUM_RUNS" ]; then
              continue
            fi

            CREATED_EPOCH=$(date -u -d "$CREATED_AT" +%s)
            if [ "$CREATED_EPOCH" -lt "$CUTOFF" ]; then
              echo "🗑️ 删除旧运行: $RUN_ID ($CREATED_AT)"
              gh api --method DELETE \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            fi
          done < <(
            gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/smart-build.yml/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .created_at] | @tsv'
          )
# 编译成功处理
  success_handler:
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    if: success()
    name: ✅ 编译成功处理
    
    steps:
      - name: 🎉 生成成功报告
        run: |
          echo "🎉 OpenWrt编译成功完成!"
          echo "📦 固件信息:"
          echo "  源码: ${{ needs.prepare.outputs.source_branch }}"
          echo "  分支: ${{ needs.prepare.outputs.repo_branch }}"
          echo "  设备: ${{ needs.prepare.outputs.target_device }}"
          echo "  插件: ${{ needs.prepare.outputs.plugins_list }}"
          echo "  标签: ${{ needs.prepare.outputs.build_tag }}"
          echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "📥 下载方式:"
          echo "  GitHub Releases (长期保存)"
          echo ""
          echo "🔗 相关链接:"
          echo "  - Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  - Releases: https://github.com/${{ github.repository }}/releases"
          echo "  - 项目主页: https://github.com/${{ github.repository }}"
