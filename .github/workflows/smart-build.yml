# OpenWrt 智能编译工作流 - 优化版本
# 支持通过Web界面触发的自动化编译，解决Ubuntu 20.04弃用问题

name: 🛠️ OpenWrt 智能编译

permissions:
  contents: read
  
on:
  # 支持通过Repository Dispatch触发（来自Web界面）
  repository_dispatch:
    types: [web_build]
    
  
  # 支持手动触发
  workflow_dispatch:
    inputs:
      source_branch:
        description: "源码仓库"
        required: true
        default: "lede-master"
        type: choice
        options:
          - openwrt-main
          - lede-master
          - immortalwrt-master
          - Lienol-master

      repo_branch:
        description: "实际仓库分支/版本（auto使用该源码的默认值）"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - main
          - master
          - "20251001"
          - "20230609"
          - "20221001"
          - openwrt-25.12
          - openwrt-24.10
          - openwrt-23.05
          - "25.12"
          - "24.10"
          - "23.05"
          - "19.07"
      
      target_device:
        description: "目标设备"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - xiaomi_4a_gigabit
          - newifi_d2
          - rpi_4b
          - nanopi_r2s
      
      plugins_list:
        description: "插件列表(用逗号分隔)"
        required: false
        default: ""
        type: string
      
      build_description:
        description: "编译描述"
        required: false
        default: "智能编译"
        type: string

# 环境变量配置
env:
  TZ: Asia/Shanghai

jobs:
  # 准备阶段：解析配置和设置环境
  prepare:
    runs-on: ubuntu-24.04  # 解决Ubuntu 20.04弃用问题，升级到24.04
    name: 📋 配置解析
    outputs:
      source_branch: ${{ steps.config.outputs.source_branch }}
      target_device: ${{ steps.config.outputs.target_device }}
      plugins_list: ${{ steps.config.outputs.plugins_list }}
      build_tag: ${{ steps.config.outputs.build_tag }}
      repo_url: ${{ steps.config.outputs.repo_url }}
      repo_branch: ${{ steps.config.outputs.repo_branch }}
      device_profile: ${{ steps.config.outputs.device_profile }}
      source_name: ${{ steps.config.outputs.source_name }}
      device_name: ${{ steps.config.outputs.device_name }}
      feeds_conf: ${{ steps.config.outputs.feeds_conf }}
      config_file: ${{ steps.config.outputs.config_file }}

      
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7  # Node.js 24
      
      - name: ⚙️ 解析编译配置
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_BRANCH: ${{ github.event.client_payload.source_branch }}
          DISPATCH_REPO_BRANCH: ${{ github.event.client_payload.repo_branch }}
          DISPATCH_TARGET_DEVICE: ${{ github.event.client_payload.target_device }}
          DISPATCH_PLUGINS: ${{ github.event.client_payload.plugins }}
          INPUT_SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
          INPUT_REPO_BRANCH: ${{ github.event.inputs.repo_branch }}
          INPUT_TARGET_DEVICE: ${{ github.event.inputs.target_device }}
          INPUT_PLUGINS: ${{ github.event.inputs.plugins_list }}
          INPUT_BUILD_DESCRIPTION: ${{ github.event.inputs.build_description }}
        run: |
          # 优先使用Repository Dispatch的配置，其次使用手动输入
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "🌐 检测到Web界面触发的编译请求"
            SOURCE_BRANCH="$DISPATCH_SOURCE_BRANCH"
            REQUESTED_REPO_BRANCH="$DISPATCH_REPO_BRANCH"
            TARGET_DEVICE="$DISPATCH_TARGET_DEVICE"
            PLUGINS_LIST="$DISPATCH_PLUGINS"
            BUILD_DESC="Web界面编译"
          else
            echo "🖱️ 检测到手动触发的编译请求"
            SOURCE_BRANCH="$INPUT_SOURCE_BRANCH"
            REQUESTED_REPO_BRANCH="$INPUT_REPO_BRANCH"
            TARGET_DEVICE="$INPUT_TARGET_DEVICE"
            PLUGINS_LIST="$INPUT_PLUGINS"
            BUILD_DESC="$INPUT_BUILD_DESCRIPTION"
          fi
          
          # 设置默认值
          SOURCE_BRANCH=${SOURCE_BRANCH:-"lede-master"}
          REQUESTED_REPO_BRANCH=${REQUESTED_REPO_BRANCH:-"auto"}
          TARGET_DEVICE=${TARGET_DEVICE:-"x86_64"}
          PLUGINS_LIST=${PLUGINS_LIST:-""}
          BUILD_DESC=${BUILD_DESC:-"智能编译"}

          # 规范化并验证插件名称，避免无效输入污染GITHUB_OUTPUT或Shell命令。
          read -ra REQUESTED_PLUGINS <<< "${PLUGINS_LIST//,/ }"
          NORMALIZED_PLUGINS=()
          for plugin in "${REQUESTED_PLUGINS[@]}"; do
            if [[ ! "$plugin" =~ ^[a-zA-Z0-9][a-zA-Z0-9._+-]*$ ]]; then
              echo "::error::无效的插件名称: $plugin"
              exit 1
            fi
            NORMALIZED_PLUGINS+=("$plugin")
          done
          PLUGINS_LIST=$(IFS=,; echo "${NORMALIZED_PLUGINS[*]}")
          
          echo "📋 编译配置信息:"
          echo "  源码仓库: $SOURCE_BRANCH"
          echo "  请求分支: $REQUESTED_REPO_BRANCH"
          echo "  目标设备: $TARGET_DEVICE"
          echo "  插件列表: $PLUGINS_LIST"
          echo "  编译描述: $BUILD_DESC"
          
          # 根据源码分支设置仓库信息和配置文件路径
          case $SOURCE_BRANCH in
            "openwrt-main")
              REPO_URL="https://github.com/openwrt/openwrt"
              DEFAULT_REPO_BRANCH="main"
              ALLOWED_REPO_BRANCHES="main openwrt-25.12 openwrt-24.10 openwrt-23.05"
              SOURCE_NAME="OpenWrt官方"
              FEEDS_CONF="config/openwrt-main/feeds.conf.default"
              CONFIG_FILE="config/openwrt-main/config"

              ;;
            "lede-master")
              REPO_URL="https://github.com/coolsnowwolf/lede"
              DEFAULT_REPO_BRANCH="master"
              ALLOWED_REPO_BRANCHES="master 20251001 20230609 20221001"
              SOURCE_NAME="Lean's LEDE"
              FEEDS_CONF="config/lede-master/feeds.conf.default"
              CONFIG_FILE="config/lede-master/config"

              ;;
            "immortalwrt-master")
              REPO_URL="https://github.com/immortalwrt/immortalwrt"
              DEFAULT_REPO_BRANCH="master"
              ALLOWED_REPO_BRANCHES="master openwrt-25.12 openwrt-24.10 openwrt-23.05"
              SOURCE_NAME="ImmortalWrt"
              FEEDS_CONF="config/immortalwrt-master/feeds.conf.default"
              CONFIG_FILE="config/immortalwrt-master/config"

              ;;
            "Lienol-master")
              REPO_URL="https://github.com/Lienol/openwrt"
              DEFAULT_REPO_BRANCH="25.12"
              ALLOWED_REPO_BRANCHES="25.12 24.10 23.05 19.07"
              SOURCE_NAME="Lienol"
              FEEDS_CONF="config/Lienol-master/feeds.conf.default"
              CONFIG_FILE="config/Lienol-master/config"

              ;;
            *)
              echo "❌ 不支持的源码分支: $SOURCE_BRANCH"
              exit 1
              ;;
          esac

          # auto使用各源码默认分支，显式选择时校验源码与分支组合。
          if [ "$REQUESTED_REPO_BRANCH" = "auto" ]; then
            REPO_BRANCH="$DEFAULT_REPO_BRANCH"
          elif [[ " $ALLOWED_REPO_BRANCHES " == *" $REQUESTED_REPO_BRANCH "* ]]; then
            REPO_BRANCH="$REQUESTED_REPO_BRANCH"
          else
            echo "::error::源码 $SOURCE_BRANCH 不支持分支/版本 $REQUESTED_REPO_BRANCH"
            echo "::error::可用分支/版本: $ALLOWED_REPO_BRANCHES"
            exit 1
          fi

          echo "  实际分支: $REPO_BRANCH"
          
          # 根据目标设备设置配置信息
          case $TARGET_DEVICE in
            "x86_64")
              DEVICE_PROFILE="x86/64"
              TARGET_SYSTEM="x86_64"
              DEVICE_NAME="X86_64"
              ;;
            "xiaomi_4a_gigabit")
              DEVICE_PROFILE="ramips/mt7621"
              TARGET_SYSTEM="ramips"
              DEVICE_NAME="小米4A千兆版"
              ;;
            "newifi_d2")
              DEVICE_PROFILE="ramips/mt7621"
              TARGET_SYSTEM="ramips"
              DEVICE_NAME="新路由3"
              ;;
            "rpi_4b")
              DEVICE_PROFILE="bcm27xx/bcm2711"
              TARGET_SYSTEM="bcm27xx"
              DEVICE_NAME="树莓派4B"
              ;;
            "nanopi_r2s")
              DEVICE_PROFILE="rockchip/armv8"
              TARGET_SYSTEM="rockchip"
              DEVICE_NAME="NanoPi_R2S"
              ;;
            *)
              echo "❌ 不支持的目标设备: $TARGET_DEVICE"
              exit 1
              ;;
          esac
          
          # 生成构建标签
          BRANCH_TAG=$(printf '%s' "$REPO_BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')
          BUILD_TAG="OpenWrt_${SOURCE_NAME// /_}_${BRANCH_TAG}_${DEVICE_NAME}_$(date +%Y%m%d_%H%M%S)"
          
          # 输出配置到环境变量
          echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT
          echo "target_device=$TARGET_DEVICE" >> $GITHUB_OUTPUT
          printf 'plugins_list=%s\n' "$PLUGINS_LIST" >> "$GITHUB_OUTPUT"
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "repo_url=$REPO_URL" >> $GITHUB_OUTPUT
          echo "repo_branch=$REPO_BRANCH" >> $GITHUB_OUTPUT
          echo "device_profile=$DEVICE_PROFILE" >> $GITHUB_OUTPUT
          echo "source_name=$SOURCE_NAME" >> $GITHUB_OUTPUT
          echo "device_name=$DEVICE_NAME" >> $GITHUB_OUTPUT
          echo "feeds_conf=$FEEDS_CONF" >> $GITHUB_OUTPUT
          echo "config_file=$CONFIG_FILE" >> $GITHUB_OUTPUT

          
          echo "✅ 编译环境初始化完成,配置解析完成"
  # 编译阶段：实际的固件编译过程
  build:
    runs-on: ubuntu-24.04  # 解决Ubuntu 20.04弃用问题
    needs: prepare
    name: 🔨 固件编译
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}  # 安全检查
    permissions:
      contents: write
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v7

      - name: 🚀 初始化编译环境
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "🔧 开始初始化编译环境..."
          
          # 显示系统信息
          echo "📋 系统信息:"
          lsb_release -a
          echo "💾 磁盘空间:"
          df -h
          
          # 清理Docker镜像和不必要文件释放空间
          echo "🧹 清理系统空间..."
          docker rmi $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null || true
          
          # 更新软件包列表
          echo "🔄 更新软件包列表..."
          sudo -E apt-get update
          
          # 清理不必要的软件包 (更安全的方式)
          echo "🗑️ 清理不必要的软件包..."
          sudo -E apt-get remove --purge azure-cli -y || true
          sudo -E apt-get remove --purge firefox -y || true
          sudo -E apt-get remove --purge powershell -y || true
          sudo -E apt-get remove --purge thunderbird -y || true
          sudo -E apt-get remove --purge libreoffice* -y || true
          
          # 分组安装依赖包以提高成功率
          echo "📦 安装核心构建工具..."
          sudo -E apt-get install -y \
            build-essential \
            cmake \
            autoconf \
            automake \
            libtool \
            pkg-config \
            bison \
            flex \
            ccache \
            git \
            curl \
            wget \
            rsync \
            unzip \
            bzip2 \
            gzip \
            tar \
            patch \
            gettext \
            file \
            time || echo "⚠️ 某些核心工具安装失败，但可能不影响编译"
          
          echo "📚 安装开发库..."
          sudo -E apt-get install -y \
            libncurses5-dev \
            libncursesw5-dev \
            zlib1g-dev \
            libssl-dev \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libreadline-dev \
            gnutls-dev || echo "⚠️ 某些开发库安装失败，但可能不影响编译"
          
          echo "🐍 安装Python环境..."
          sudo -E apt-get install -y \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-wheel || echo "⚠️ Python环境安装可能不完整"
          
          # 尝试安装Python相关包（可能在某些环境中不可用）
          sudo -E apt-get install -y \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            python3-distutils 2>/dev/null || echo "⚠️ 某些Python包不可用，将跳过"
          
          echo "🛠️ 安装OpenWrt特定工具..."
          sudo -E apt-get install -y \
            gawk \
            asciidoc \
            binutils \
            device-tree-compiler \
            fastjar \
            help2man \
            intltool \
            mkisofs \
            scons \
            subversion \
            xmlto \
            xsltproc \
            qemu-utils \
            squashfs-tools \
            swig \
            yasm \
            p7zip \
            p7zip-full || echo "⚠️ 某些OpenWrt工具安装失败，但可能不影响编译"
          
          # 尝试安装可能不可用的包
          echo "🔧 尝试安装额外工具..."
          sudo -E apt-get install -y \
            antlr3 \
            ecj \
            uglifyjs \
            ninja-build \
            lrzsz \
            msmtp 2>/dev/null || echo "⚠️ 某些额外工具不可用，将跳过"
          
          # 尝试安装多架构支持（可能在某些环境中不可用）
          echo "🏗️ 尝试安装多架构支持..."
          sudo -E apt-get install -y \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 2>/dev/null || echo "⚠️ 多架构支持不可用，将跳过"
          
          # 安装Node.js（用于某些构建工具）
          echo "📱 安装Node.js..."
          if ! command -v node &> /dev/null; then
            curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash - || echo "⚠️ Node.js源添加失败"
            sudo -E apt-get install -y nodejs || echo "⚠️ Node.js安装失败"
          fi
          
          # 如果uglifyjs不可用，尝试通过npm安装
          if ! command -v uglifyjs &> /dev/null && command -v npm &> /dev/null; then
            echo "📦 通过npm安装uglifyjs..."
            sudo npm install -g uglify-js || echo "⚠️ npm安装uglifyjs失败"
          fi
          
          # 系统清理
          echo "🧹 清理系统..."
          sudo -E systemctl daemon-reload
          sudo -E apt-get autoremove --purge -y
          sudo -E apt-get autoclean
          sudo -E apt-get clean
          
          # 创建工作目录
          echo "📁 创建工作目录..."
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          
          # 设置时区
          echo "🕒 设置时区..."
          sudo timedatectl set-timezone "$TZ"
          
          # 验证关键工具
          echo "✅ 验证编译环境..."
          echo "GCC版本: $(gcc --version | head -1)"
          echo "Make版本: $(make --version | head -1)"
          echo "Git版本: $(git --version)"
          echo "Python版本: $(python3 --version)"
          echo "CMake版本: $(cmake --version | head -1 2>/dev/null || echo '未安装')"
          
          # 显示最终的磁盘空间
          echo "💾 清理后磁盘空间:"
          df -h
          
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ 编译环境初始化完成, 编译环境初始化完成"
      - name: 📦 克隆源码
        id: codes
        working-directory: /workdir
        if: steps.init.outputs.status == 'success' && !cancelled()
        run: |
          echo "📦 开始克隆源码..."
          echo "  仓库: ${{ needs.prepare.outputs.repo_url }}"
          echo "  分支: ${{ needs.prepare.outputs.repo_branch }}"
          
          # 显示磁盘空间
          df -hT $PWD
          
          # 克隆源码（只克隆最新提交以节省时间和空间）
          git clone -q --single-branch --depth=1 \
            --branch "${{ needs.prepare.outputs.repo_branch }}" \
            "${{ needs.prepare.outputs.repo_url }}" openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ 源码克隆完成"
      - name: 🔧 加载自定义feeds
        env:
          PLUGINS_LIST: ${{ needs.prepare.outputs.plugins_list }}
        run: |
          echo "🔧 配置自定义feeds..."
          
          # 如果存在对应分支的feeds配置文件则使用
          if [ -f "${{ needs.prepare.outputs.feeds_conf }}" ]; then
            cp -f "${{ needs.prepare.outputs.feeds_conf }}" openwrt/feeds.conf.default
            echo "📋 使用自定义feeds配置: ${{ needs.prepare.outputs.feeds_conf }}"
          else
            echo "📋 使用默认feeds配置"
          fi

          # 保留当前源码自带的feeds，只追加所选插件需要的第三方feeds。
          # 这样可避免把OpenWrt、LEDE、ImmortalWrt等不同源码的基础feeds混用。
          bash script/manage-feeds.sh "$PLUGINS_LIST" openwrt/feeds.conf.default

      - name: 📥 更新feeds
        run: |
          echo "📥 开始更新feeds..."
          cd openwrt/
          ./scripts/feeds update -a
          echo "✅ feeds更新完成"
      - name: 📦 安装feeds
        run: |
          echo "📦 开始安装feeds..."
          cd openwrt/
          ./scripts/feeds install -a
          echo "✅ feeds安装完成"
      - name: 🔧 生成最终编译配置
        env:
          PLUGINS_LIST: ${{ needs.prepare.outputs.plugins_list }}
        run: |
          echo "🔧 开始生成最终编译配置..."
          cd openwrt
          
          # 设备推荐插件
          RECOMMEND_PLUGINS=""
          case "${{ needs.prepare.outputs.target_device }}" in
            "x86_64")
              echo "生成x86_64基础配置..."
              cat > .config << 'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF
              RECOMMEND_PLUGINS="luci kmod-e1000 kmod-igb"
              ;;
            "xiaomi_4a_gigabit"|"newifi_d2")
              RECOMMEND_PLUGINS="luci kmod-mt76 kmod-usb2"
              ;;
            "rpi_4b")
              RECOMMEND_PLUGINS="luci kmod-usb3 kmod-sound-core kmod-fs-ext4"
              ;;
            "nanopi_r2s")
              RECOMMEND_PLUGINS="luci kmod-usb-net-rtl8152"
              ;;
            *)
              RECOMMEND_PLUGINS="luci"
              ;;
          esac
          # 合并用户插件和推荐插件，去重
          PLUGINS=$(printf '%s' "$PLUGINS_LIST" | tr ',' ' ')
          ALL_PLUGINS="$RECOMMEND_PLUGINS $PLUGINS"
          # 去重
          ALL_PLUGINS=$(printf '%s\n' $ALL_PLUGINS | sed '/^$/d' | sort -u | tr '\n' ' ')
          if [ -n "$ALL_PLUGINS" ]; then
            echo "🔧 配置选中的插件..."
            for plugin in $ALL_PLUGINS; do
              plugin=$(echo "$plugin" | xargs)  # 去除空格
              if [ -n "$plugin" ]; then
                if [[ ! "$plugin" =~ ^[a-zA-Z0-9][a-zA-Z0-9._+-]*$ ]]; then
                  echo "::error::无效的插件名称: $plugin"
                  exit 1
                fi
                echo "CONFIG_PACKAGE_$plugin=y" >> .config
                echo "  ✓ 添加插件: $plugin"

                # 新版官方feeds提供netdata本体，但可能不再提供luci-app-netdata。
                # 同时尝试本体，后续验证会优先接受LuCI包，缺失时使用本体。
                if [ "$plugin" = "luci-app-netdata" ]; then
                  echo "CONFIG_PACKAGE_netdata=y" >> .config
                fi
              fi
            done
          fi
          
          # 生成最终配置
          make defconfig

          # make defconfig会静默丢弃不存在的包，必须验证用户选择确实生效。
          CONFIG_ERRORS=0
          for plugin in $PLUGINS; do
            if grep -qx "CONFIG_PACKAGE_${plugin}=y" .config; then
              echo "  ✅ 已启用用户插件: $plugin"
            elif [ "$plugin" = "luci-app-netdata" ] && grep -qx "CONFIG_PACKAGE_netdata=y" .config; then
              echo "::warning::luci-app-netdata不可用，已改用netdata本体"
            else
              echo "::error::插件不存在或未成功启用: $plugin"
              CONFIG_ERRORS=$((CONFIG_ERRORS + 1))
            fi
          done

          if [ "$CONFIG_ERRORS" -ne 0 ]; then
            echo "::error::共有 $CONFIG_ERRORS 个用户插件未进入最终配置"
            exit 1
          fi
          
          echo "📋 最终配置文件预览："
          grep -m 20 -E "^CONFIG_TARGET|^CONFIG_PACKAGE.*=y" .config
          
          echo "✅ 编译配置生成完成"
      - name: 📥 下载依赖包
        id: package
        run: |
          echo "📥 开始下载依赖包..."
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ 依赖包下载完成"
      - name: 🔨 编译固件
        id: compile
        run: |
          echo "🔨 开始编译固件..."
          cd openwrt
          
          echo "使用 $(nproc) 线程编译"
          # 使用多线程编译，失败时降级到单线程
          make -j$(nproc) V=s || make -j1 || make -j1 V=s
          
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ 固件编译完成"
      - name: 📊 检查空间使用
        if: (!cancelled())
        run: |
          echo "📊 检查磁盘空间使用情况..."
          df -hT
      - name: 📦 整理编译产物
        id: organize
        if: steps.compile.outputs.status == 'success'
        env:
          SOURCE_BRANCH: ${{ needs.prepare.outputs.source_branch }}
          REPO_BRANCH: ${{ needs.prepare.outputs.repo_branch }}
          TARGET_DEVICE: ${{ needs.prepare.outputs.target_device }}
        run: |
          echo "📦 开始整理编译产物..."
          cd openwrt/bin/targets/*/*
          
          # 删除packages目录以节省空间
          rm -rf packages
          
          # 计算固件大小
          FIRMWARE_SIZE=$(du -sh . | cut -f1)
          echo "FIRMWARE_SIZE=$FIRMWARE_SIZE" >> $GITHUB_ENV
          
          # 重命名固件文件，同时保留原始类型名，避免多个.gz文件互相覆盖。
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SOURCE_CLEAN=$(printf '%s_%s' "$SOURCE_BRANCH" "$REPO_BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')
          DEVICE_CLEAN=$(printf '%s' "$TARGET_DEVICE" | sed 's/[^a-zA-Z0-9._-]/_/g')
          FIRMWARE_COUNT=0

          for file in *; do
            if [[ "$file" == *.bin ]] || [[ "$file" == *.img ]] || [[ "$file" == *.gz ]]; then
              ORIGINAL_NAME="${file#openwrt-}"
              NEW_NAME="OpenWrt_${SOURCE_CLEAN}_${DEVICE_CLEAN}_${TIMESTAMP}_${ORIGINAL_NAME}"
              mv -- "$file" "$NEW_NAME"
              FIRMWARE_COUNT=$((FIRMWARE_COUNT + 1))
              echo "📦 重命名: $file -> $NEW_NAME"
            fi
          done

          if [ "$FIRMWARE_COUNT" -eq 0 ]; then
            echo "::error::目标目录中没有找到固件文件"
            exit 1
          fi
          
          # 生成详细的固件信息文件
          cat > firmware_info.txt << EOF
          OpenWrt 智能编译固件信息
          ========================
          
          📋 基本信息:
          编译时间: $(date '+%Y-%m-%d %H:%M:%S')
          构建标签: ${{ needs.prepare.outputs.build_tag }}
          源码仓库: ${{ needs.prepare.outputs.source_name }}
          实际分支: ${{ needs.prepare.outputs.repo_branch }}
          目标设备: ${{ needs.prepare.outputs.device_name }}
          固件大小: ${FIRMWARE_SIZE}
          
          🔧 编译配置:
          选中插件: ${{ needs.prepare.outputs.plugins_list }}
          设备配置: ${{ needs.prepare.outputs.device_profile }}
          
          📱 默认信息:
          - 默认IP地址: 192.168.1.1
          - 默认用户名: root
          - 默认密码: 以所选源码的默认配置为准，请首次登录后立即设置
          - 默认WiFi名: OpenWrt (如支持)
          - 默认WiFi密码: 无
          
          📖 使用说明:
          1. 刷机前请确认设备型号和硬件版本
          2. 建议先备份原厂固件
          3. 刷机有风险，请谨慎操作
          4. 如遇问题可尝试救砖操作
          
          🔗 相关链接:
          - 项目地址: https://github.com/${{ github.repository }}
          - OpenWrt官网: https://openwrt.org
          - 使用文档: https://github.com/${{ github.repository }}/wiki
          
          ⚠️ 免责声明:
          本固件仅供学习交流使用，使用者需自行承担刷机风险。
          EOF
          
          # 生成SHA256校验文件
          for file in OpenWrt_*.bin OpenWrt_*.img OpenWrt_*.gz; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> sha256sums.txt
              echo "🔒 生成校验: $file"
            fi
          done
          
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ 编译产物整理完成"
      - name: ⬆️ 上传固件到 Artifacts
        uses: actions/upload-artifact@v7  # 更新到最新版本
        if: steps.organize.outputs.status == 'success'
        with:
          name: ${{ needs.prepare.outputs.build_tag }}
          path: ${{ env.FIRMWARE_PATH }}
          retention-days: 7

      - name: 🎉 生成发布版本
        id: release
        if: steps.organize.outputs.status == 'success'
        run: |
          RELEASE_TAG="${{ needs.prepare.outputs.build_tag }}"
          RELEASE_NAME="OpenWrt 智能编译 - ${{ needs.prepare.outputs.device_name }} ($(date '+%Y-%m-%d %H:%M'))"
          
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          
          echo "📋 发布信息:"
          echo "标签: $RELEASE_TAG"
          echo "名称: $RELEASE_NAME"
      - name: 📢 发布固件到 Releases
        uses: softprops/action-gh-release@v3  # Node.js 24
        if: steps.release.outputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: ${{ steps.release.outputs.release_name }}
          body_path: ${{ env.FIRMWARE_PATH }}/firmware_info.txt
          files: |
            ${{ env.FIRMWARE_PATH }}/OpenWrt_*
            ${{ env.FIRMWARE_PATH }}/sha256sums.txt
          draft: false
          prerelease: false

      - name: 📊 编译完成通知
        run: |
          echo "🎉 OpenWrt智能编译任务完成!"
          echo "📦 固件信息:"
          echo "  源码: ${{ needs.prepare.outputs.source_name }}"
          echo "  设备: ${{ needs.prepare.outputs.device_name }}"
          echo "  大小: ${{ env.FIRMWARE_SIZE }}"
          echo "  标签: ${{ needs.prepare.outputs.build_tag }}"
          echo ""
          echo "🔗 下载链接:"
          echo "  Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  Releases: https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.release_tag }}"
          echo ""
          echo "📝 编译日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
# 编译失败处理
  failure_handler:
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    if: failure()
    name: ❌ 编译失败处理
    
    steps:
      - name: 📝 生成失败报告
        run: |
          echo "❌ OpenWrt工作流失败"
          echo "📋 失败信息:"
          echo "  配置解析Job: ${{ needs.prepare.result }}"
          echo "  构建与发布Job: ${{ needs.build.result }}"
          echo "  源码: ${{ needs.prepare.outputs.source_branch }}"
          echo "  分支: ${{ needs.prepare.outputs.repo_branch }}"
          echo "  设备: ${{ needs.prepare.outputs.target_device }}"
          echo "  插件: ${{ needs.prepare.outputs.plugins_list }}"
          echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "🔍 排查顺序:"
          echo "  1. 查看日志中最早出现的 ::error:: 或 Error"
          echo "  2. 检查插件可用性与feeds更新结果"
          echo "  3. 检查固件编译、Artifact上传和Release发布步骤"
          echo "  4. 检查网络、磁盘空间或上游源码问题"
          echo ""
          echo "📖 解决建议:"
          echo "  1. 检查插件冲突检测结果"
          echo "  2. 减少选择的插件数量"
          echo "  3. 选择更稳定的源码分支"
          echo "  4. 查看详细的编译日志"
          echo ""
          echo "🔗 编译日志: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

# 工作流记录清理：使用GitHub CLI替代未固定版本的第三方Action。
  cleanup:
    runs-on: ubuntu-24.04
    needs: build
    if: always()
    name: 🧹 清理旧的工作流程记录
    permissions:
      actions: write
      contents: read

    steps:
      - name: 🧹 保留7天内且至少5次运行
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RETAIN_DAYS: "7"
          KEEP_MINIMUM_RUNS: "5"
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "$RETAIN_DAYS days ago" +%s)
          RUN_INDEX=0

          while IFS=$'\t' read -r RUN_ID CREATED_AT; do
            RUN_INDEX=$((RUN_INDEX + 1))
            if [ "$RUN_INDEX" -le "$KEEP_MINIMUM_RUNS" ]; then
              continue
            fi

            CREATED_EPOCH=$(date -u -d "$CREATED_AT" +%s)
            if [ "$CREATED_EPOCH" -lt "$CUTOFF" ]; then
              echo "🗑️ 删除旧运行: $RUN_ID ($CREATED_AT)"
              gh api --method DELETE \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            fi
          done < <(
            gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/smart-build.yml/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .created_at] | @tsv'
          )
# 编译成功处理
  success_handler:
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    if: success()
    name: ✅ 编译成功处理
    
    steps:
      - name: 🎉 生成成功报告
        run: |
          echo "🎉 OpenWrt编译成功完成!"
          echo "📦 固件信息:"
          echo "  源码: ${{ needs.prepare.outputs.source_branch }}"
          echo "  分支: ${{ needs.prepare.outputs.repo_branch }}"
          echo "  设备: ${{ needs.prepare.outputs.target_device }}"
          echo "  插件: ${{ needs.prepare.outputs.plugins_list }}"
          echo "  标签: ${{ needs.prepare.outputs.build_tag }}"
          echo "  时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "📥 下载方式:"
          echo "  1. GitHub Actions Artifacts (7天有效期)"
          echo "  2. GitHub Releases (长期保存)"
          echo ""
          echo "🔗 相关链接:"
          echo "  - Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  - Releases: https://github.com/${{ github.repository }}/releases"
          echo "  - 项目主页: https://github.com/${{ github.repository }}"
